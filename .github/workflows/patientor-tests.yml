name: Patientor Tests

on:
  push:
    branches: [ main, master ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install patientor backend dependencies
      working-directory: ./patientor/backend
      run: npm install

    - name: Lint patientor backend
      working-directory: ./patientor/backend
      run: npm run lint

    - name: Start patientor backend server
      working-directory: ./patientor/backend
      run: npm start &

    - name: Install API test dependencies
      working-directory: ./patientor/patientor-api-tests
      run: npm install

    - name: Install Playwright browsers
      working-directory: ./patientor/patientor-api-tests
      run: npx playwright install --with-deps chromium

    - name: Wait for backend to start
      run: npx wait-on http://localhost:3001/api/ping --timeout 60000

    - name: Run API tests
      working-directory: ./patientor/patientor-api-tests
      run: npm test

    - name: Upload API test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-playwright-report
        path: patientor/patientor-api-tests/playwright-report/
        retention-days: 30

  e2e-tests:
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install patientor backend dependencies
      working-directory: ./patientor/backend
      run: npm install

    - name: Start patientor backend
      working-directory: ./patientor/backend
      run: npm start &

    - name: Install patientor frontend dependencies
      working-directory: ./patientor/frontend
      run: npm install

    - name: Build patientor frontend
      working-directory: ./patientor/frontend
      run: npm run build

    - name: Start patientor frontend preview
      working-directory: ./patientor/frontend
      run: npx vite preview --port 5173 &

    - name: Install E2E test dependencies
      working-directory: ./patientor/patientor-tests
      run: npm install

    - name: Install Playwright browsers
      working-directory: ./patientor/patientor-tests
      run: npx playwright install --with-deps chromium

    - name: Wait for servers to start
      run: npx wait-on http://localhost:3001/api/ping http://localhost:5173 --timeout 60000

    - name: Run E2E tests
      working-directory: ./patientor/patientor-tests
      run: npm test

    - name: Upload E2E test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-playwright-report
        path: patientor/patientor-tests/playwright-report/
        retention-days: 30
