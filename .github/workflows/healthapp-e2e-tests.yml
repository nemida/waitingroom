name: Health app E2E Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install healthapp dependencies
      working-directory: ./healthapp
      run: npm install

    - name: Lint healthapp
      working-directory: ./healthapp
      run: npm run lint

    - name: Start healthapp server
      working-directory: ./healthapp
      run: npm start &

    - name: Install test dependencies
      working-directory: ./healthapp-tests
      run: npm install

    - name: Install Playwright browsers
      working-directory: ./healthapp-tests
      run: npx playwright install --with-deps chromium

    - name: Wait for server to start
      run: npx wait-on http://localhost:3001 --timeout 60000

    - name: Run e2e tests
      working-directory: ./healthapp-tests
      run: npm test

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: healthapp-tests/playwright-report/
        retention-days: 30
